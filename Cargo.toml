[workspace]
resolver = "2"
members = ["crates/rim-core", "crates/rim-cli", "crates/rim-plugin-sdk", "app", "plugins/pomodoro", "plugins/todo", "plugins/player"]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Crypto (Argon2, Olm) is painfully slow unoptimised; optimise deps even in dev.
[profile.dev.package."*"]
opt-level = 2
