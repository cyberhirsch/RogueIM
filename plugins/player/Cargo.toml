[package]
name = "rim-plugin-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rim-plugin-sdk = { version = "0.1.0", path = "../../crates/rim-plugin-sdk" }
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation"] }

[dev-dependencies]
interprocess = "2"
