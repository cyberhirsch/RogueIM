[package]
name = "rim-plugin-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rim-plugin-sdk = { version = "0.1.0", path = "../../crates/rim-plugin-sdk" }
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
interprocess = "2"
