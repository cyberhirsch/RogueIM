name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PKGS: -p rogueim -p rim-cli -p rim-plugin-pomodoro -p rim-plugin-todo -p rim-plugin-player
  BINS: rogueim rim-cli rim-plugin-pomodoro rim-plugin-todo rim-plugin-player

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev \
            libpipewire-0.3-dev libclang-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libgbm-dev libegl-dev libdrm-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rim-core -p rim-plugin-sdk -p rim-plugin-pomodoro -p rim-plugin-player -p rim-plugin-todo
      - run: cargo build -p rogueim -p rim-cli

  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-latest, name: macos-universal }
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev \
            libpipewire-0.3-dev libclang-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libgbm-dev libegl-dev libdrm-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: cargo build --release $PKGS

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release $PKGS --target aarch64-apple-darwin
          cargo build --release $PKGS --target x86_64-apple-darwin
          mkdir -p target/release
          for b in $BINS; do
            lipo -create -output target/release/$b \
              target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
          done

      - name: Package
        shell: bash
        run: |
          d="RogueIM-${{ matrix.name }}"
          mkdir -p "dist/$d"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          for b in $BINS; do cp "target/release/$b$ext" "dist/$d/"; done
          "target/release/rogueim$ext" --export-sounds "dist/$d/sounds"
          cp README.md LICENSE "dist/$d/"
          cd dist
          # macOS ships as a single .dmg (next step), the others as archives.
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$d.zip" "$d" > /dev/null; elif [ "$RUNNER_OS" = "Linux" ]; then tar czf "$d.tar.gz" "$d"; fi

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $src = (Resolve-Path "dist/RogueIM-${{ matrix.name }}").Path
          $out = (Resolve-Path "dist").Path
          & $iscc "/DAppVersion=$version" "/DSourceDir=$src" "/DOutputDir=$out" deploy/windows/rogueim.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/*setup.exe

      - name: macOS app bundle and disk image
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          app="dist/dmg/RogueIM.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # Everything lives inside the app: programs, plugins, the CLI, docs.
          for b in rogueim rim-cli rim-plugin-pomodoro rim-plugin-todo rim-plugin-player; do cp "target/release/$b" "$app/Contents/MacOS/"; done
          cp README.md LICENSE "$app/Contents/Resources/"
          sed "s/@VERSION@/$version/" deploy/macos/Info.plist > "$app/Contents/Info.plist"
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s app/assets/icon.png --out icon.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $((s*2)) $((s*2)) app/assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/RogueIM.icns"
          # Ad-hoc signature: no Apple account, but a consistent, valid signature.
          for b in "$app"/Contents/MacOS/*; do codesign --force --sign - "$b"; done
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname RogueIM -srcfolder dist/dmg -ov -format UDZO "dist/RogueIM-${{ matrix.name }}.dmg"

      - name: Node .deb
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p rim-cli --no-build --no-strip --output dist/
          for f in dist/*.deb; do mv "$f" "dist/rogueim-node-${{ matrix.name }}.deb"; done

      - uses: actions/upload-artifact@v4
        with:
          name: RogueIM-${{ matrix.name }}
          path: |
            dist/RogueIM-${{ matrix.name }}.*
            dist/*setup.exe
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and signature (for the in-app updater)
        env:
          RIM_RELEASE_KEY: ${{ secrets.RIM_RELEASE_KEY }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          if [ -z "$RIM_RELEASE_KEY" ]; then echo "RIM_RELEASE_KEY secret missing"; exit 1; fi
          umask 077
          printf '%s\n' "$RIM_RELEASE_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: RogueIM ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
