name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PKGS: -p rogueim -p rim-cli -p rim-plugin-pomodoro -p rim-plugin-todo -p rim-plugin-player -p rim-plugin-mail -p rim-plugin-phone
  BINS: rogueim rim-cli rim-plugin-pomodoro rim-plugin-todo rim-plugin-player rim-plugin-mail rim-plugin-phone rim-plugin-whatsapp rim-plugin-telegram rim-plugin-signal
  # Go plugins, built with CGO off (pure Go SQLite), so they cross-compile.
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev \
            libpipewire-0.3-dev libclang-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libgbm-dev libegl-dev libdrm-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            plugins/signal -> target
      # Each engine test runs two or three full network nodes; the small CI runners
      # get flaky timeouts when all of them run at once.
      - run: cargo test -p rim-core -p rim-plugin-sdk -p rim-plugin-pomodoro -p rim-plugin-player -p rim-plugin-todo -p rim-plugin-mail -p rim-plugin-phone -- --test-threads=2
      - run: cargo build -p rogueim -p rim-cli
      - run: cargo test -p rogueim -p rim-drop --features rim-drop/server,rim-drop/client
      # The download page decrypts what rim-drop's format seals (known answer).
      - run: node site/f/test.js
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/whatsapp/go.mod
          cache-dependency-path: plugins/whatsapp/go.sum
      - run: go vet ./... && go test ./...
        working-directory: plugins/whatsapp
      - run: go vet ./... && go test ./...
        working-directory: plugins/telegram
      # The Signal plugin is its own Cargo workspace (libsignal's versions and patches).
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo test --manifest-path plugins/signal/Cargo.toml

  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-latest, name: macos-universal }
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev \
            libpipewire-0.3-dev libclang-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libgbm-dev libegl-dev libdrm-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          workspaces: |
            . -> target
            plugins/signal -> target
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/whatsapp/go.mod
          cache-dependency-path: |
            plugins/whatsapp/go.sum
            plugins/telegram/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release $PKGS
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          (cd plugins/whatsapp && go build -trimpath -ldflags "-s -w" -o "../../target/release/rim-plugin-whatsapp$ext" .)
          (cd plugins/telegram && go build -trimpath -ldflags "-s -w" -o "../../target/release/rim-plugin-telegram$ext" .)
          cargo build --release --manifest-path plugins/signal/Cargo.toml
          cp "plugins/signal/target/release/rim-plugin-signal$ext" target/release/

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release $PKGS --target aarch64-apple-darwin
          cargo build --release $PKGS --target x86_64-apple-darwin
          (cd plugins/whatsapp && GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../../target/aarch64-apple-darwin/release/rim-plugin-whatsapp .)
          (cd plugins/whatsapp && GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../../target/x86_64-apple-darwin/release/rim-plugin-whatsapp .)
          (cd plugins/telegram && GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../../target/aarch64-apple-darwin/release/rim-plugin-telegram .)
          (cd plugins/telegram && GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../../target/x86_64-apple-darwin/release/rim-plugin-telegram .)
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --manifest-path plugins/signal/Cargo.toml --target $t
            cp plugins/signal/target/$t/release/rim-plugin-signal target/$t/release/
          done
          mkdir -p target/release
          for b in $BINS; do
            lipo -create -output target/release/$b \
              target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
          done

      - name: Package
        shell: bash
        run: |
          d="RogueIM-${{ matrix.name }}"
          mkdir -p "dist/$d"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          for b in $BINS; do cp "target/release/$b$ext" "dist/$d/"; done
          "target/release/rogueim$ext" --export-sounds "dist/$d/sounds"
          cp README.md LICENSE "dist/$d/"
          cd dist
          # macOS ships as a single .dmg (next step), the others as archives.
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$d.zip" "$d" > /dev/null; elif [ "$RUNNER_OS" = "Linux" ]; then tar czf "$d.tar.gz" "$d"; fi

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $src = (Resolve-Path "dist/RogueIM-${{ matrix.name }}").Path
          $out = (Resolve-Path "dist").Path
          & $iscc "/DAppVersion=$version" "/DSourceDir=$src" "/DOutputDir=$out" deploy/windows/rogueim.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/*setup.exe

      - name: macOS app bundle and disk image
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          app="dist/dmg/RogueIM.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # Everything lives inside the app: programs, plugins, the CLI, docs.
          for b in $BINS; do cp "target/release/$b" "$app/Contents/MacOS/"; done
          cp README.md LICENSE "$app/Contents/Resources/"
          sed "s/@VERSION@/$version/" deploy/macos/Info.plist > "$app/Contents/Info.plist"
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s app/assets/icon.png --out icon.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $((s*2)) $((s*2)) app/assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/RogueIM.icns"
          # Ad-hoc signature: no Apple account, but a consistent, valid signature.
          for b in "$app"/Contents/MacOS/*; do codesign --force --sign - "$b"; done
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname RogueIM -srcfolder dist/dmg -ov -format UDZO "dist/RogueIM-${{ matrix.name }}.dmg"

      - name: Node .deb
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p rim-cli --no-build --no-strip --output dist/
          for f in dist/*.deb; do mv "$f" "dist/rogueim-node-${{ matrix.name }}.deb"; done

      - uses: actions/upload-artifact@v4
        with:
          name: RogueIM-${{ matrix.name }}
          path: |
            dist/RogueIM-${{ matrix.name }}.*
            dist/*setup.exe
            dist/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Signed with the release key when the secrets are set, else with a debug key
      # (then an update needs uninstalling the app first).
      - name: Build and test the phone app
        working-directory: android
        env:
          RIM_APK_KEY_B64: ${{ secrets.RIM_APK_KEY_B64 }}
          RIM_APK_PASS: ${{ secrets.RIM_APK_PASS }}
        run: |
          if [ -n "$RIM_APK_KEY_B64" ]; then
            echo "$RIM_APK_KEY_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export RIM_APK_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew --no-daemon assembleRelease testDebugUnitTest
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/RogueIM-Phone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RogueIM-Phone
          path: dist/RogueIM-Phone.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and signature (for the in-app updater)
        env:
          RIM_RELEASE_KEY: ${{ secrets.RIM_RELEASE_KEY }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          if [ -z "$RIM_RELEASE_KEY" ]; then echo "RIM_RELEASE_KEY secret missing"; exit 1; fi
          umask 077
          printf '%s\n' "$RIM_RELEASE_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: RogueIM ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
