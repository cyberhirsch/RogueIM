[package]
name = "rogueim"
version = "0.1.5"
edition = "2024"

[dependencies]
arboard = "3.6.1"
auto-launch = "0.6"
aec-rs = "1"
cpal = "0.17"
directories = "6.0.0"
openh264 = "0.9"
xcap = "0.9"
nnnoiseless = { version = "0.5", default-features = false }
opus = "0.4"
ed25519-dalek = "2"
flate2 = "1"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["sync"] }
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
global-hotkey = "0.8"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
interprocess = "2"
notify-rust = "4"
raw-window-handle = "0.6"
rfd = "0.17"
rim-core = { version = "0.1.0", path = "../crates/rim-core" }
rim-plugin-sdk = { version = "0.1.0", path = "../crates/rim-plugin-sdk" }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030", "renderer-software"] }
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tray-icon = "0.25"

[build-dependencies]
slint-build = "1.18"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
